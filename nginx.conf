server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location ~* \.(css|js|png|jpg|jpeg|webp|svg|woff2?|ttf|otf|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Lo que antes iba a 404 con _redirects: vuelve a la tienda.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /index.html;
}
